name: Checkpointed Window SuSiE Image CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/checkpointed-window-susie-image.yml"
      - "containers/CheckpointedWindowSusie/Dockerfile"
      - "R/scripts/run_checkpointed_window_susie.R"
      - "R/utils/CheckpointedWindowSusieFunctions.R"
      - "R/utils/CheckpointStore.R"
      - "tests/test_checkpointed_window_container.sh"
      - "tests/test_checkpointed_window_manifest.R"
      - "tests/test_checkpoint_store.R"
      - "tests/test_checkpointed_window_model.R"
      - "tests/test_checkpointed_window_controller.R"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/checkpointed-window-susie-image.yml"
      - "containers/CheckpointedWindowSusie/Dockerfile"
      - "R/scripts/run_checkpointed_window_susie.R"
      - "R/utils/CheckpointedWindowSusieFunctions.R"
      - "R/utils/CheckpointStore.R"
      - "tests/test_checkpointed_window_container.sh"
      - "tests/test_checkpointed_window_manifest.R"
      - "tests/test_checkpoint_store.R"
      - "tests/test_checkpointed_window_model.R"
      - "tests/test_checkpointed_window_controller.R"

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Log in to ghcr.io with docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image for smoke tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/CheckpointedWindowSusie/Dockerfile
          load: true
          tags: susier-checkpointed-window:smoke-test

      - name: Smoke test docker image
        run: |
          set -euo pipefail
          docker run --rm susier-checkpointed-window:smoke-test test -f /opt/r/scripts/run_checkpointed_window_susie.R
          docker run --rm susier-checkpointed-window:smoke-test test -f /opt/r/lib/CheckpointedWindowSusieFunctions.R
          docker run --rm susier-checkpointed-window:smoke-test test -f /opt/r/lib/CheckpointStore.R
          docker run --rm susier-checkpointed-window:smoke-test Rscript /opt/r/scripts/run_checkpointed_window_susie.R --help
          docker run --rm susier-checkpointed-window:smoke-test Rscript -e 'library(tidyverse); library(data.table); library(arrow); library(jsonlite); library(digest); library(susieR); stopifnot(nzchar(Sys.which("gsutil")))'
          docker run --rm -v "$PWD:/work" -w /work susier-checkpointed-window:smoke-test Rscript tests/test_checkpointed_window_manifest.R
          docker run --rm -v "$PWD:/work" -w /work susier-checkpointed-window:smoke-test Rscript tests/test_checkpoint_store.R
          docker run --rm -v "$PWD:/work" -w /work susier-checkpointed-window:smoke-test Rscript tests/test_checkpointed_window_model.R
          docker run --rm -v "$PWD:/work" -w /work susier-checkpointed-window:smoke-test Rscript tests/test_checkpointed_window_controller.R

      - name: Run installed end-to-end smoke test
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/tests/fixtures/checkpointed_window:/fixtures:ro" \
            susier-checkpointed-window:smoke-test \
            bash -c '
              set -euo pipefail
              export CHECKPOINTED_SUSIE_RUNTIME_IMAGE="local-smoke@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
              Rscript /opt/r/scripts/run_checkpointed_window_susie.R \
                --window-id chr1_0_2000000 \
                --window-dosage /fixtures/window_dosage.tsv \
                --window-phenotypes /fixtures/window_phenotypes.tsv \
                --phenotype-data /fixtures/window_phenotypes.bed.gz \
                --covariate-files /fixtures/shared_covariates.tsv,/fixtures/expression_covariates.tsv \
                --covariate-modalities shared,expression \
                --keep-samples /fixtures/keep_samples.tsv \
                --checkpoint-root /tmp/checkpoints \
                --output-dir /tmp/first
              test -s /tmp/first/window_manifest.json
              test -s /tmp/first/window_fit_index.tsv
              Rscript /opt/r/scripts/run_checkpointed_window_susie.R \
                --window-id chr1_0_2000000 \
                --window-dosage /fixtures/window_dosage.tsv \
                --window-phenotypes /fixtures/window_phenotypes.tsv \
                --phenotype-data /fixtures/window_phenotypes.bed.gz \
                --covariate-files /fixtures/shared_covariates.tsv,/fixtures/expression_covariates.tsv \
                --covariate-modalities shared,expression \
                --keep-samples /fixtures/keep_samples.tsv \
                --checkpoint-root /tmp/checkpoints \
                --output-dir /tmp/resumed
              diff /tmp/first/window_fit_index.tsv /tmp/resumed/window_fit_index.tsv
              test -s /tmp/resumed/window_manifest.json
            '

      - name: Extract Docker metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/checkpointed-window

      - name: Build and push docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/CheckpointedWindowSusie/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
