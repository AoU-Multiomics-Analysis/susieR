name: SuSiE PGEN image CI

# Only a change to source installed in the image starts an automatic build.
# Use workflow_dispatch to test changes to the image recipe or tests themselves.
on:
  workflow_dispatch:
    inputs:
      full_checks:
        description: "Run the complete regression and legacy parity suites"
        type: boolean
        required: false
        default: false
  push:
    branches: ["main"]
    paths:
      - "R/utils/ImportFunctions.R"
      - "R/utils/InitFunctions.R"
      - "R/utils/MemoryHelpers.R"
      - "R/utils/OptParser.R"
      - "R/utils/SusiePerformance.R"
      - "R/utils/PgenRuntime.R"
      - "R/utils/SusieFunctions.R"
      - "R/utils/PgenFunctions.R"
      - "R/utils/PgenCacheFunctions.R"
      - "R/utils/PgenMemoryFunctions.R"
      - "R/utils/SusieOutputFunctions.R"
      - "R/utils/PgenGeneFunctions.R"
      - "R/utils/PgenBatchFunctions.R"
      - "R/utils/PgenQcFunctions.R"
      - "R/utils/PgenPreparationFunctions.R"
      - "R/scripts/filter_pgen_susie.R"
      - "R/scripts/prepare_pgen_susie.R"
      - "R/scripts/plan_pgen_susie.R"
      - "R/scripts/run_pgen_susie_batch.R"
      - "R/scripts/aggregate_pgen_susie.R"
      - "R/scripts/susie.R"
  pull_request:
    branches: ["main", "codex/susier-performance"]
    paths:
      - "R/utils/ImportFunctions.R"
      - "R/utils/InitFunctions.R"
      - "R/utils/MemoryHelpers.R"
      - "R/utils/OptParser.R"
      - "R/utils/SusiePerformance.R"
      - "R/utils/PgenRuntime.R"
      - "R/utils/SusieFunctions.R"
      - "R/utils/PgenFunctions.R"
      - "R/utils/PgenCacheFunctions.R"
      - "R/utils/PgenMemoryFunctions.R"
      - "R/utils/SusieOutputFunctions.R"
      - "R/utils/PgenGeneFunctions.R"
      - "R/utils/PgenBatchFunctions.R"
      - "R/utils/PgenQcFunctions.R"
      - "R/utils/PgenPreparationFunctions.R"
      - "R/scripts/filter_pgen_susie.R"
      - "R/scripts/prepare_pgen_susie.R"
      - "R/scripts/plan_pgen_susie.R"
      - "R/scripts/run_pgen_susie_batch.R"
      - "R/scripts/aggregate_pgen_susie.R"
      - "R/scripts/susie.R"

permissions:
  contents: read

concurrency:
  group: susier-pgen-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check image and build boundaries
        run: |
          python3 -m pip install PyYAML==6.0.2 miniwdl==1.14.2
          python3 tests/test_pgen_image_config.py
          python3 tests/test_pgen_container_mode.py
          python3 tests/test_pgen_wdl.py

  image:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image for installed-code tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/SusieR2/Dockerfile
          platforms: linux/amd64
          load: true
          tags: susier-pgen:smoke-test
          cache-from: type=gha,scope=susier-pgen
          cache-to: type=gha,mode=max,scope=susier-pgen
      - name: Check CPU detection inside a limited container
        run: |
          docker run --rm --cpus=1 susier-pgen:smoke-test Rscript -e '
            source(file.path(Sys.getenv("SUSIER_FUNCTIONS_PATH"), "PgenRuntime.R"))
            threading <- configurePgenThreads(0)
            stopifnot(threading$available_threads == 1L, threading$selected_threads == 1L)
          '
      - name: Test installed PGEN pipeline
        env:
          FULL_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_checks || false }}
        run: |
          set -euo pipefail
          test_args=(bash tests/test_pgen_container.sh)
          if [[ "$FULL_CHECKS" == "true" ]]; then
            test_args+=(--full)
          fi
          docker run --rm \
            --volume "$PWD/tests:/repo/tests:ro" \
            --workdir /repo \
            susier-pgen:smoke-test "${test_args[@]}"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/SusieR2/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/aou-multiomics-analysis/susier/pgen:main
            ghcr.io/aou-multiomics-analysis/susier/pgen:latest
            ghcr.io/aou-multiomics-analysis/susier/pgen:sha-${{ github.sha }}
          cache-from: type=gha,scope=susier-pgen
