name: WDL validation

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/wdl-validation.yml"
      - "tests/test_covariate_explained_wdl.sh"
      - "tests/test_pgen_wdl.py"
      - "tests/test_pgen_womtool.sh"
      - "tests/test_pgen_wom_render.scala"
      - "workflows/**/*.wdl"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/wdl-validation.yml"
      - "tests/test_covariate_explained_wdl.sh"
      - "tests/test_pgen_wdl.py"
      - "tests/test_pgen_womtool.sh"
      - "tests/test_pgen_wom_render.scala"
      - "workflows/**/*.wdl"

jobs:
  miniwdl-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install miniwdl
        run: python3 -m pip install miniwdl==1.14.2

      - name: Set up Java for Cromwell validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Check PGEN descriptor with Cromwell's parser
        env:
          WOMTOOL_JAR: ${{ runner.temp }}/womtool-85.jar
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$WOMTOOL_JAR" \
            https://github.com/broadinstitute/cromwell/releases/download/85/womtool-85.jar
          echo "53e0d6201933a5c335437dcafd62625e9f241995d450dfd1b5c0ca37a834f89b  $WOMTOOL_JAR" | sha256sum --check -
          bash tests/test_pgen_womtool.sh .

      - name: Check diagnostic outputs and Terra expression rules
        run: bash tests/test_covariate_explained_wdl.sh

      - name: Check PGEN task localization and workflow expression rules
        run: python3 tests/test_pgen_wdl.py .

      - name: Check WDLs
        working-directory: workflows
        run: |
          miniwdl check AggregateSusie.wdl
          miniwdl check AggregateSusieTask.wdl
          miniwdl check AnnotateSusie.wdl
          miniwdl check CheckpointedWindowSusie.wdl
          miniwdl check ComputeAncestrySkew.wdl
          miniwdl check ComputeR2Susie.wdl
          miniwdl check prepInputsSusieR.wdl
          miniwdl check susieR.wdl
          miniwdl check susieRonly.wdl
          miniwdl check SusieR2.wdl
