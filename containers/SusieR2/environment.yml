name: base
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - r-base=4.4.3
  - r-tidyverse=2.0.0
  - r-data.table=1.17.0
  - r-optparse=1.7.5
  - r-arrow=18.1.0
  - r-devtools=2.4.5
  - r-rfast=2.1.5.2
  - r-matrixstats=1.5.0
  - r-digest=0.6.37
  - r-jsonlite=1.8.9
  - r-assertthat=0.2.1
  - r-caret=6.0_94
  - r-igraph=2.1.4
  - r-lobstr=1.1.2
  # Build and runtime dependencies of the fixed susieR/pgenlibr sources.
  - r-rcpp=1.0.14
  - r-cpp11=0.5.2
  - r-cpp11armadillo=0.4.1
  - r-mixsqp=0.3_54
  - r-reshape=0.8.9
  - r-crayon=1.5.3
  - cxx-compiler=1.9.0
  - make=4.4.1
  - pkg-config=0.29.2
  # pgenlibr needs headers and linker files, not only runtime libzlib.
  - zlib=1.3.1
  - zstd=1.5.7
  - libdeflate=1.22
  - plink2=2.0.0a.6.9
  # htslib supplies bgzip and tabix for the legacy dosage parity test.
  - htslib=1.21
  - bioconductor-genomicranges=1.58.0
  - bioconductor-summarizedexperiment=1.36.0
  - bioconductor-rsamtools=2.22.0
